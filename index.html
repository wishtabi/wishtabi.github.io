<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1B2A4A">
<title>وش تبي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
:root{
  /* layout: one phone-width column — navy header, content cards, bottom tab bar per role */
  --bg:#F2F4F8; --surface:#FFFFFF; --ink:#16233F; --muted:#66708A; --line:#E2E6EF;
  --navy:#1B2A4A; --on-navy:#FFFFFF; --accent:#EB8420; --accent-ink:#FFFFFF; --accent-soft:#FDEEDC;
  --good:#1D8456; --good-soft:#E2F3EA; --warn:#A86C12; --warn-soft:#FAF0DA; --bad:#BE3D36; --bad-soft:#FBE5E3; --info:#2D58B3; --info-soft:#E5ECFA;
  --font:'Tajawal','Segoe UI',Tahoma,Arial,sans-serif;
  --r:14px; --shadow:0 1px 2px rgba(22,35,63,.05),0 6px 18px rgba(22,35,63,.06);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0D1322; --surface:#162035; --ink:#E7EBF4; --muted:#97A1BA; --line:#26314A;
    --navy:#0A1121; --accent:#F29A3A; --accent-soft:#3A2915;
    --good:#4CC38A; --good-soft:#12352A; --warn:#E3A84C; --warn-soft:#382C13; --bad:#EE7A72; --bad-soft:#3A1D1C; --info:#82A5F1; --info-soft:#1A2747;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1322; --surface:#162035; --ink:#E7EBF4; --muted:#97A1BA; --line:#26314A;
  --navy:#0A1121; --accent:#F29A3A; --accent-soft:#3A2915;
  --good:#4CC38A; --good-soft:#12352A; --warn:#E3A84C; --warn-soft:#382C13; --bad:#EE7A72; --bad-soft:#3A1D1C; --info:#82A5F1; --info-soft:#1A2747;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{margin:0;text-wrap:balance;line-height:1.3}
p{margin:0}
.num,.q-price,.tile b{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .sm{font-size:13px} .xs{font-size:12px}
.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic.sm{width:17px;height:17px} .ic.xs{width:14px;height:14px;vertical-align:-2px}

.app{max-width:480px;margin:0 auto;min-height:100%;background:var(--bg);position:relative;padding-bottom:96px}
@media (min-width:520px){.app{box-shadow:0 0 0 1px var(--line)}}

/* header */
.top{position:sticky;top:0;z-index:20;background:var(--navy);color:var(--on-navy);display:flex;align-items:center;gap:10px;padding:10px 14px;min-height:60px}
.brand{display:flex;align-items:center;flex:1}
.logo{display:inline-flex;align-items:center;gap:4px;font-weight:800;font-size:24px;letter-spacing:0}
.logo svg{width:28px;height:28px}
.htitle{flex:1;font-weight:700;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{background:rgba(255,255,255,.1);border:0;color:inherit;width:38px;height:38px;border-radius:12px;display:grid;place-items:center}
.who{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.1);border:0;color:inherit;border-radius:999px;padding:5px 6px 5px 12px;max-width:62%}
.who-av{width:30px;height:30px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:800;flex:none}
.who-txt{display:flex;flex-direction:column;align-items:flex-start;line-height:1.15;min-width:0}
.who-txt b{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:120px}
.who-txt small{font-size:11.5px;opacity:.75}
.strip{background:var(--accent-soft);color:var(--ink);font-size:12.5px;text-align:center;padding:6px 14px}

.main{padding:16px;display:flex;flex-direction:column;gap:18px}
section{display:flex;flex-direction:column;gap:10px}
.sec-h{display:flex;align-items:center;justify-content:space-between}
.sec-h h2{font-size:17px}
.card{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;display:flex;flex-direction:column;gap:12px}
.card-h{font-size:15px;font-weight:700}
.link{background:none;border:0;color:var(--accent);font-weight:700;padding:4px}
.stack{display:flex;flex-direction:column;gap:12px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.list{display:flex;flex-direction:column;gap:10px}

/* greeting + ask */
.hello h1{font-size:22px;font-weight:800}
.hello p{display:flex;align-items:center;gap:4px;margin-top:2px}
.ask{border-top:4px solid var(--accent)}
.ask-title{font-size:26px;font-weight:800;display:flex;align-items:center;gap:8px}
textarea,input[type=text],input[type=number],input[type=tel],input[type=password],input[type=date],input:not([type]),select{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:11px 12px;outline:none}
textarea{resize:vertical;min-height:84px}
textarea:focus,input:focus,select:focus{border-color:var(--accent)}
.fld{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--muted)}
.fld input,.fld select,.fld textarea{color:var(--ink);font-size:15px}
.field-label{font-size:13px;color:var(--muted);margin-bottom:-6px}
.sel{display:flex;align-items:center;gap:6px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:0 10px;color:var(--muted)}
.sel select{border:0;background:transparent;padding:10px 0;color:var(--ink)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;margin-inline:-2px;scrollbar-width:none}
.chips.scroll::-webkit-scrollbar{display:none}
.hs{position:relative}
.hs .chips.scroll{scroll-behavior:smooth;padding-bottom:2px}
.hs-track{height:5px;border-radius:99px;background:var(--line);margin-top:8px;position:relative;overflow:hidden;cursor:pointer}
.hs-thumb{position:absolute;top:0;bottom:0;inset-inline-start:0;border-radius:99px;background:var(--accent);opacity:.75;transition:inset-inline-start .08s linear}
.hs-arr{position:absolute;top:0;height:38px;width:34px;border:0;display:grid;place-items:center;cursor:pointer;color:var(--ink);z-index:2;padding:0}
.hs-arr span{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--surface);box-shadow:var(--shadow);font-size:18px;font-weight:800;line-height:1}
.hs-arr.next{inset-inline-end:-4px;background:linear-gradient(to left,var(--surface) 55%,transparent)}
.hs-arr.prev{inset-inline-start:-4px;background:linear-gradient(to right,var(--surface) 55%,transparent)}
.hs-arr[hidden]{display:none}
.chip{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font-size:14px}
.chip.on{background:var(--navy);color:var(--on-navy);border-color:var(--navy)}
.target{display:flex;align-items:center;gap:6px;flex-wrap:wrap;background:var(--info-soft);border-radius:12px;padding:9px 12px;font-size:14px}
.thumb{position:relative;width:110px}
.thumb img{width:110px;height:110px;object-fit:cover;border-radius:12px;display:block}
.thumb .x{position:absolute;top:6px;inset-inline-start:6px;background:rgba(0,0,0,.6);color:#fff;border:0;border-radius:50%;width:26px;height:26px;display:grid;place-items:center}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 16px;font-weight:700;font-size:15px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.dark{background:var(--navy);border-color:var(--navy);color:var(--on-navy)}
.btn.ghost{background:var(--bg)}
.btn.danger{color:var(--bad);border-color:var(--bad-soft);background:var(--bad-soft)}
.btn.good{background:var(--good);border-color:var(--good);color:#fff}
.btn.block{width:100%}
.btn.sm{padding:8px 12px;font-size:14px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.file{cursor:pointer;font-weight:500;color:var(--muted)}
.actions{display:flex;flex-direction:column;gap:8px}
.actions .pair{display:grid;grid-template-columns:2fr 1fr;gap:8px}

/* categories */
.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.cat{background:var(--surface);border:0;border-radius:var(--r);box-shadow:var(--shadow);padding:14px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13.5px;font-weight:700}
.cat .ic{width:28px;height:28px;color:var(--accent)}

/* provider cards */
.pcard{background:var(--surface);border:0;border-radius:var(--r);box-shadow:var(--shadow);padding:12px;display:flex;align-items:center;gap:12px;text-align:start;width:100%}
.pav{width:46px;height:46px;border-radius:12px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none}
.pbody{flex:1;display:flex;flex-direction:column;min-width:0}
.pbody b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pmeta{display:flex;flex-direction:column;align-items:flex-end;gap:2px;flex:none}
.star{color:var(--accent);font-weight:700;font-size:14px;white-space:nowrap}

/* order cards */
.ocard{background:var(--surface);border:0;border-radius:var(--r);box-shadow:var(--shadow);padding:13px 14px;display:flex;flex-direction:column;gap:6px;text-align:start;width:100%;border-inline-start:4px solid var(--line)}
.ocard.t-info{border-inline-start-color:var(--info)} .ocard.t-warn{border-inline-start-color:var(--warn)} .ocard.t-good{border-inline-start-color:var(--good)} .ocard.t-bad{border-inline-start-color:var(--bad)}
.ocard-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.ocard-title{display:flex;align-items:center;gap:7px;min-width:0}
.ocard-title b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ocat{color:var(--muted);display:inline-flex}
.ocard-sum{font-size:14px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ocard-meta{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;color:var(--muted)}
.ocard-meta b{color:var(--ink);font-size:14px}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag.bad{background:var(--bad-soft);color:var(--bad)}
.pernav{display:flex;align-items:center;gap:8px;margin:2px 0}
.pernav .seg{flex:1;box-shadow:none;background:var(--bg)}
.perbar{display:flex;align-items:center;justify-content:space-between;gap:8px}
.perbar .lbl{font-weight:800;font-size:14px;text-align:center;flex:1}
.persum{display:flex;justify-content:space-between;align-items:center;background:var(--navy);color:var(--on-navy);border-radius:var(--r);padding:12px 14px}
.persum b{font-size:19px}.persum small{opacity:.8;display:block;font-size:12px}
.grp{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);border-inline-start:4px solid var(--good);overflow:hidden}
.grp.due{border-inline-start-color:var(--bad)}.grp.out{border-inline-start-color:var(--line);opacity:.75}
.grp-h{display:flex;align-items:center;gap:10px;width:100%;border:0;background:transparent;font:inherit;color:inherit;padding:12px 14px;cursor:pointer;text-align:start}
.grp-h .nm{flex:1;min-width:0}.grp-h .nm b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grp-h .nm small{color:var(--muted);font-size:12.5px}
.grp-h .am{text-align:end;white-space:nowrap}.grp-h .am b{font-size:15.5px}.grp-h .am small{display:block;font-size:11.5px;color:var(--bad);font-weight:700}
.grp-h .chev{transition:transform .2s;color:var(--muted);font-size:18px}.grp.open .chev{transform:rotate(-90deg)}
.grp-b{border-top:1px solid var(--line)}
.gline{display:block;width:100%;border:0;border-bottom:1px solid var(--line);background:transparent;font:inherit;color:inherit;text-align:start;padding:10px 14px;cursor:pointer}
.gline:last-child{border-bottom:0}.gline.due{background:var(--bad-soft)}.gline.out{opacity:.55}
.gline .r1,.gline .r2{display:flex;justify-content:space-between;gap:8px;align-items:center}
.gline .r1{font-size:12.5px;color:var(--muted)}.gline .r1 .amt{display:flex;gap:6px;align-items:center;white-space:nowrap}.gline .r1 b{color:var(--ink);font-size:14px}
.gline .r2{font-size:13.5px;margin-top:3px}.gline .r2 span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ocard.due{border-inline-start-color:var(--bad);background:linear-gradient(to left,var(--bad-soft),var(--surface) 38%)}
.ocard .orow{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12.5px;color:var(--muted)}
.ocard .orow .amt{display:flex;align-items:center;gap:6px;white-space:nowrap;flex:none}
.ocard .orow>span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ocard .orow b{color:var(--ink);font-size:14.5px}
.ocard .ocard-sum.one{-webkit-line-clamp:1;font-size:13px}
.duebox{border:1.5px solid var(--bad-soft);background:var(--bad-soft);color:var(--bad);border-radius:var(--r);padding:12px 14px}
.duebox .line{color:var(--ink)}
.duebox h3{margin:0 0 6px;font-size:15px;color:var(--bad)}
.tag{font-size:12px;font-weight:700;border-radius:999px;padding:2px 9px;background:var(--bg);color:var(--muted)}
.tag.accent{background:var(--accent-soft);color:var(--accent)}
.tag.good{background:var(--good-soft);color:var(--good)}
.pill{font-size:12px;font-weight:700;border-radius:999px;padding:3px 10px;white-space:nowrap;flex:none}
.t-info.pill{background:var(--info-soft);color:var(--info)} .t-warn.pill{background:var(--warn-soft);color:var(--warn)}
.t-good.pill{background:var(--good-soft);color:var(--good)} .t-bad.pill{background:var(--bad-soft);color:var(--bad)}

/* segmented */
.seg{display:flex;gap:4px;background:var(--surface);box-shadow:var(--shadow);border-radius:12px;padding:4px;overflow-x:auto;scrollbar-width:none}
.seg button{flex:1;border:0;background:transparent;border-radius:9px;padding:8px 10px;font-size:13.5px;font-weight:700;color:var(--muted);white-space:nowrap}
.seg button.on{background:var(--navy);color:var(--on-navy)}
.cnt{display:inline-grid;place-items:center;min-width:19px;height:19px;border-radius:999px;background:var(--accent);color:#fff;font-size:11.5px;padding:0 5px}
.empty{text-align:center;color:var(--muted);padding:28px 16px;background:var(--surface);border-radius:var(--r);border:1px dashed var(--line)}

/* order detail */
.ohead-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.oid{font-size:19px;font-weight:800}
.bar{display:flex;gap:4px;direction:rtl}
.bar i{flex:1;height:7px;border-radius:4px;background:var(--line)}
.bar i.d{background:var(--good)}
.bar i.c{background:var(--accent)}
.bar-l{display:flex;justify-content:space-between;gap:8px;font-size:13.5px}
.note{background:var(--bg);border-radius:12px;padding:10px 12px;font-size:14px;display:flex;gap:6px;align-items:flex-start}
.note.bad{background:var(--bad-soft);color:var(--bad);font-weight:700}
.note.warn{background:var(--warn-soft);color:var(--warn)}
.note.info{background:var(--info-soft);color:var(--info)}
.parties{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.party{display:flex;flex-direction:column;gap:1px;min-width:0}
.party .role{font-size:12px;color:var(--muted)}
.lines{display:flex;flex-direction:column}
.line{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.line:last-child{border-bottom:0}
.line.total{font-weight:800;font-size:16px}
.meta-row{display:flex;align-items:center;gap:6px;font-size:13.5px;color:var(--muted);flex-wrap:wrap}
.req{font-size:16px;line-height:1.7}
.photo{width:100%;max-height:260px;object-fit:cover;border-radius:12px}
.quotes{display:flex;flex-direction:column;gap:10px}
.quote{border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:6px}
.quote.best{border-color:var(--good)}
.q-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.q-price{font-size:20px;font-weight:800}
.msgs{display:flex;flex-direction:column;gap:8px;max-height:320px;overflow-y:auto}
.msg{align-self:flex-end;max-width:82%;background:var(--bg);border-radius:14px 14px 4px 14px;padding:8px 12px;font-size:14px;display:flex;flex-direction:column}
.msg.me{align-self:flex-start;background:var(--info-soft);border-radius:14px 14px 14px 4px}
.msg-by{font-size:11.5px;color:var(--muted);font-weight:700}
.msg-t{font-size:11px;color:var(--muted);align-self:flex-end}
.chat-in{display:flex;gap:8px}
.chat-in button{flex:none}
details.log summary{cursor:pointer;font-weight:700;font-size:14px;color:var(--muted)}
.log ol{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:8px;border-inline-start:2px solid var(--line);padding-inline-start:12px}
.log li{font-size:13.5px}
.log li span{display:block;font-size:12px;color:var(--muted)}
.stars{display:flex;gap:6px;direction:ltr;justify-content:flex-end}
.stars button{background:none;border:0;padding:2px;color:var(--line)}
.stars button.on{color:var(--accent)}
.stars .ic{width:32px;height:32px}
.stars.ro .ic{width:18px;height:18px}
.stars .on .ic{fill:currentColor}

/* provider page */
.phead{display:flex;gap:14px;align-items:center}
.phead .pav{width:58px;height:58px}
.phead h1{font-size:20px;font-weight:800}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.fact{background:var(--bg);border-radius:12px;padding:8px 10px;display:flex;flex-direction:column}
.fact span{font-size:12px;color:var(--muted)}
.fact b{font-size:14px}
.item{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item .nm{display:flex;flex-direction:column}
.item.off .nm{opacity:.5}
.stepper{display:flex;align-items:center;gap:4px;background:var(--bg);border-radius:999px;padding:3px}
.stepper button{width:32px;height:32px;border-radius:50%;border:0;background:var(--surface);display:grid;place-items:center;box-shadow:var(--shadow)}
.stepper b{min-width:22px;text-align:center}
.add1{border:1px solid var(--accent);color:var(--accent);background:transparent;border-radius:999px;padding:6px 16px;font-weight:700}
details.more summary{cursor:pointer;color:var(--accent);font-weight:700;list-style:none}
details.more summary::-webkit-details-marker{display:none}
details.more[open] summary{margin-bottom:12px}
.cartbar{position:fixed;bottom:14px;inset-inline:0;margin:0 auto;max-width:448px;width:calc(100% - 32px);z-index:25;display:flex;align-items:center;justify-content:space-between;background:var(--navy);color:var(--on-navy);border:0;border-radius:16px;padding:14px 18px;font-weight:700;box-shadow:0 10px 30px rgba(10,17,33,.35)}
.cartbar .cnt{background:var(--accent)}
.opts{display:grid;gap:8px}
.opt{display:flex;align-items:center;justify-content:space-between;border:1.5px solid var(--line);border-radius:12px;padding:12px;background:var(--surface);text-align:start}
.opt.on{border-color:var(--accent);background:var(--accent-soft)}
.opt span{display:flex;flex-direction:column}

/* tiles */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:14px;display:flex;flex-direction:column;gap:2px}
.tile span{font-size:13px;color:var(--muted)}
.tile b{font-size:22px;font-weight:800}
.tile small{font-size:12px;color:var(--muted)}
.tile.hl{background:var(--navy);color:var(--on-navy)}
.tile.hl span,.tile.hl small{color:rgba(255,255,255,.75)}
.hbar{display:flex;flex-direction:column;gap:8px}
.hbar div{display:grid;grid-template-columns:70px 1fr 28px;gap:8px;align-items:center;font-size:13.5px}
.hbar i{display:block;height:9px;border-radius:5px;background:var(--accent);min-width:3px}
.hbar em{font-style:normal;font-variant-numeric:tabular-nums;color:var(--muted);text-align:end}
.switch{width:46px;height:28px;border-radius:999px;border:0;background:var(--line);position:relative;flex:none;transition:background .2s}
.switch::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:inset-inline-start .2s}
.switch.on{background:var(--good)}
.switch.on::after{inset-inline-start:21px}
.checks{display:flex;flex-wrap:wrap;gap:8px}
.checks label{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:14px;color:var(--ink)}
.toggle-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.toggle-row span{display:flex;flex-direction:column}

/* bottom nav */
.tabs{position:fixed;bottom:0;inset-inline:0;margin:0 auto;max-width:480px;z-index:20;background:var(--surface);border-top:1px solid var(--line);display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
.tabs button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;font-weight:700;color:var(--muted);padding:6px 2px;position:relative;border-radius:10px}
.tabs button.on{color:var(--accent)}
.tabs .cnt{position:absolute;top:0;inset-inline-end:calc(50% - 26px)}

/* sheet + toast */
.scrim{position:fixed;inset:0;background:rgba(8,12,24,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:480px;border-radius:20px 20px 0 0;padding:8px 16px calc(18px + env(safe-area-inset-bottom));max-height:86%;overflow-y:auto;display:flex;flex-direction:column;gap:12px}
.grab{width:42px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 2px}
.sheet h2{font-size:18px}
.plist{display:flex;flex-direction:column;gap:6px}
.pitem{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;text-align:start;width:100%}
.pitem.on{border-color:var(--accent);background:var(--accent-soft)}
.pitem .who-av{width:34px;height:34px}
.pitem .pi-txt{display:flex;flex-direction:column;flex:1;min-width:0}
.pitem .cnt{flex:none}
[hidden]{display:none!important}
.menu-tools{position:sticky;top:60px;z-index:10;background:var(--bg);padding:8px 0;display:flex;flex-direction:column;gap:8px}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0 12px;color:var(--muted)}
.search:focus-within{border-color:var(--accent)}
.search input{border:0;background:transparent;padding:11px 0;color:var(--ink)}
.msec{scroll-margin-top:150px;gap:4px}
.msec-h{display:flex;justify-content:space-between;align-items:baseline;padding-bottom:6px;border-bottom:2px solid var(--accent-soft)}
.msec-h h3{font-size:15px}
.starter h2{font-size:19px}
.cchk{display:flex;align-items:center;gap:10px;padding:10px 2px;border-bottom:1px solid var(--line);cursor:pointer}
.cchk input{width:20px;height:20px;accent-color:var(--accent);flex:none}
.cchk .nm{flex:1}
.sheet-foot{position:sticky;bottom:calc(-18px - env(safe-area-inset-bottom));background:var(--surface);padding:10px 0 6px;display:flex;gap:8px;border-top:1px solid var(--line)}
.grp{font-size:12.5px;color:var(--muted);font-weight:700;margin-top:6px}
.toast{position:fixed;top:72px;inset-inline:0;margin:0 auto;width:max-content;max-width:calc(100% - 32px);background:var(--navy);color:var(--on-navy);padding:10px 16px;border-radius:12px;z-index:60;font-size:14px;font-weight:500;box-shadow:0 10px 30px rgba(10,17,33,.3);animation:tin .25s ease}
@keyframes tin{from{transform:translateY(-8px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:370px){.cats{grid-template-columns:repeat(3,1fr)}.facts{grid-template-columns:1fr 1fr}}

.loadbar{position:fixed;top:0;inset-inline:0;height:3px;z-index:80;overflow:hidden;display:none;background:var(--accent-soft)}
.busy .loadbar{display:block}
.loadbar i{display:block;height:100%;width:40%;background:var(--accent);animation:lb 1.1s infinite ease-in-out}
@keyframes lb{from{transform:translateX(160%)}to{transform:translateX(-260%)}}
.busy .app [data-act],.busy .app form button,.busy .sheet button{pointer-events:none;opacity:.6}
.spin{width:26px;height:26px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp .8s linear infinite;margin:10px auto}
@keyframes sp{to{transform:rotate(360deg)}}
.center{display:flex;flex-direction:column;align-items:center;gap:14px;padding:40px 20px;text-align:center}
.center.full{min-height:100vh;justify-content:center}
.center .logo{font-size:34px;color:var(--ink)} .center .logo svg{width:36px;height:36px}
.center-t{text-align:center;align-items:center}
.auth{min-height:100%}
.auth-hero{background:var(--navy);color:var(--on-navy);padding:44px 20px 64px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.auth-hero .logo{font-size:40px} .auth-hero .logo svg{width:42px;height:42px}
.auth-hero p{opacity:.8}
.auth-body{margin-top:-36px;padding:0 16px 32px}
.auth h2{font-size:19px}
.pcard{padding:0;overflow:hidden;display:flex;align-items:stretch}
.pmain{flex:1;display:flex;align-items:center;gap:12px;padding:12px;border:0;background:none;text-align:start;min-width:0}
.fav{border:0;background:none;color:var(--line);padding:0 14px;display:grid;place-items:center;border-inline-start:1px solid var(--line)}
.fav.on{color:var(--accent)} .fav.on .ic,.btn.favon .ic{fill:currentColor}
.btn.favon{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.favrow{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.favrow::-webkit-scrollbar{display:none}
.favchip{flex:none;display:flex;align-items:center;gap:10px;background:var(--surface);border:1.5px solid var(--accent-soft);border-radius:var(--r);box-shadow:var(--shadow);padding:10px 14px 10px 12px;text-align:start;max-width:240px}
.favchip .pav{width:38px;height:38px}
.favchip span:last-child{display:flex;flex-direction:column;min-width:0}
.favchip b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.favchip small{color:var(--muted);font-size:12px}
.iact{display:flex;gap:6px;align-items:center}
.iconbtn.light{background:var(--bg);color:var(--ink)}
.stars span{color:var(--line)} .stars span.on{color:var(--accent)}
.stars.ro{justify-content:flex-start}
input:disabled{opacity:.7}
.trx{display:block}
details.orig{margin-top:4px}
details.orig summary{font-size:12px;color:var(--muted);cursor:pointer;list-style:none}
details.orig summary::-webkit-details-marker{display:none}
details.orig[open] summary{margin-bottom:2px}
details.orig span{font-size:13px;color:var(--muted)}
.ar-sub{display:block;font-size:12px;color:var(--muted);font-weight:400}
.hint{margin-top:-4px;display:flex;gap:4px;align-items:center}
[lang=ur]{font-family:'Noto Nastaliq Urdu','Jameel Noori Nastaleeq',var(--font);line-height:1.9}
.mapbox{position:relative;direction:ltr;border-radius:14px;overflow:hidden;border:1px solid var(--line)}
.map{height:300px;background:var(--bg)}
.mapbox .pin{position:absolute;left:50%;top:50%;width:24px;height:31px;transform:translate(-50%,-100%);z-index:500;pointer-events:none;filter:drop-shadow(0 3px 4px rgba(0,0,0,.35))}
.loc-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.loc-row .muted{flex:1;min-width:150px}
.seg.mini{box-shadow:none;border:1px solid var(--line);padding:3px;flex:none}
.seg.mini button{padding:5px 10px;font-size:12.5px}
.addr{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line)}
.addr:last-child{border-bottom:0}
.addr .pav{width:40px;height:40px}
.addr-b{flex:1;display:flex;flex-direction:column;gap:2px;min-width:0}
.addr-acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.nat{font-family:ui-monospace,Menlo,Consolas,monospace;letter-spacing:.5px;direction:ltr;unicode-bidi:isolate}
.dist{font-size:12px;color:var(--muted);white-space:nowrap}
.checks label.dim{opacity:.5}

  else if (state.sub.per === 'week') { a = new Date(n); a.setDate(a.getDate() - ((a.getDay() + 1) % 7) + off * 7); b = new Date(a); b.setDate(b.getDate() + 7); const e = new Date(b); e.setDate(e.getDate() - 1); l = `${off === 0 ? 'هذا الأسبوع' : off === -1 ? 'الأسبوع الماضي' : 'أسبوع'} ${f(a)} – ${f(e)}` }
  else { a = new Date(n.getFullYear(), n.getMonth() + off, 1); b = new Date(a.getFullYear(), a.getMonth() + 1, 1); l = `${['يناير', 'فبراير', 'مارس', 'أبريل', 'مايو', 'يونيو', 'يوليو', 'أغسطس', 'سبتمبر', 'أكتوبر', 'نوفمبر', 'ديسمبر'][a.getMonth()]} ${a.getFullYear()}` }

/* الطلبات مجمّعة حسب الطرف الآخر: سطر لكل محل أو عميل، ويفتح لتفاصيل طلباته */
function groupedOrders(list, keyOf, nameOf, emptyTxt) {
  const r = perRange(), inP = list.filter(o => o.createdAt >= r.a && o.createdAt < r.b).sort(byNew);
  const live = o => !['cancelled', 'rejected'].includes(o.status), amt = o => o.total || o.subtotal || 0;
  const tot = inP.filter(live).reduce((s, o) => s + amt(o), 0), cnt = inP.filter(live).length;
  const groups = groupBy(inP, keyOf).map(([k, a]) => ({ k, a, name: nameOf(a[0]), sum: a.filter(live).reduce((s, o) => s + amt(o), 0), due: a.filter(isDue).reduce((s, o) => s + amt(o), 0) })).sort((x, y) => y.sum - x.sum);
  const head = `<div class="pernav">${seg('per', [['day', 'يومي'], ['week', 'أسبوعي'], ['month', 'شهري']]).replace(/data-act="sub" data-key="per"/g, 'data-act="per"')}</div>
    <div class="perbar"><button class="iconbtn light" data-act="perShift" data-k="-1" aria-label="الفترة السابقة">›</button><span class="lbl">${r.l}</span><button class="iconbtn light" data-act="perShift" data-k="1" aria-label="الفترة التالية" ${state.perOff >= 0 ? 'disabled style="opacity:.35"' : ''}>‹</button></div>`;
  if (!inP.length) return head + empty(emptyTxt);
  const gl = groups.filter(g => g.a.some(live)).length;
  const line = o => { const sum = o.type === 'menu' ? o.items.map((i, x) => `${itemTrName(i, o, x) || i.name}${i.qty > 1 ? ` ×${i.qty}` : ''}`).join('، ') : (o.textTr || o.text);
    return `<button class="gline ${isDue(o) ? 'due' : ''} ${live(o) ? '' : 'out'}" data-act="open" data-v="order" data-id="${o.id}"><span class="r1"><span class="num">${dtText(o.createdAt)} · #${o.id}</span><span class="amt">${live(o) ? payTag(o) : pill(o)}${amt(o) ? `<b class="num">${money(amt(o))}</b>` : ''}</span></span><span class="r2"><span dir="auto">${esc(sum || '')}</span></span></button>` };
  return head + `<div class="persum"><span><small>${cnt} ${cnt === 1 ? 'طلب' : 'طلبات'} · ${gl} ${me().role === 'customer' ? (gl === 1 ? 'محل' : 'محلات') : (gl === 1 ? 'عميل' : 'عملاء')}</small>المجموع</span><b class="num">${money(tot)}</b></div>
    <div class="list">${groups.map(g => { const open = state.grpOpen[g.k]; return `<div class="grp ${g.due ? 'due' : ''} ${g.a.some(live) ? '' : 'out'} ${open ? 'open' : ''}">
      <button class="grp-h" data-act="grp" data-k="${esc(g.k)}" aria-expanded="${!!open}"><span class="nm"><b>${esc(g.name)}</b><small>${plural(g.a.length, 'طلب واحد', 'طلبان', 'طلبات')}</small></span><span class="am"><b class="num">${money(g.sum)}</b>${g.due ? `<small>منها آجل ${money(g.due)}</small>` : ''}</span><span class="chev">‹</span></button>
      ${open ? `<div class="grp-b">${g.a.map(line).join('')}</div>` : ''}</div>` }).join('')}</div>`;
}
const custNames = arr => [...new Set(arr.map(o => o.customerName).filter(Boolean))].join('، ');
function pill(o) { const s = ST[o.status]; const l = o.status === 'new' && !o.providerId ? (o.targetCount && me().role === 'customer' ? 'بانتظار المختارين' : 'مفتوح') : o.status === 'delivered' && isDue(o) ? 'تم التسليم' : s.l; return `<span class="pill t-${s.t}">${l}</span>` }

function hscrolls() {
  document.querySelectorAll('.chips.scroll').forEach(el => {
    if (el.parentElement.classList.contains('hs')) return;
    const w = document.createElement('div'); w.className = 'hs'; el.before(w); w.appendChild(el);
    w.insertAdjacentHTML('beforeend', '<button type="button" class="hs-arr prev" aria-label="السابق" hidden><span>›</span></button><button type="button" class="hs-arr next" aria-label="المزيد" hidden><span>‹</span></button><div class="hs-track" aria-hidden="true"><div class="hs-thumb"></div></div>');
    const th = w.querySelector('.hs-thumb'), tr = w.querySelector('.hs-track'), pv = w.querySelector('.prev'), nx = w.querySelector('.next');
    const rtl = getComputedStyle(el).direction === 'rtl', sgn = rtl ? -1 : 1;
    const upd = () => {
      const max = el.scrollWidth - el.clientWidth;
      if (max <= 2) { tr.hidden = pv.hidden = nx.hidden = true; return }
      tr.hidden = false;
      const pos = Math.min(1, Math.abs(el.scrollLeft) / max), sz = el.clientWidth / el.scrollWidth;
      th.style.width = (sz * 100) + '%'; th.style.insetInlineStart = (pos * (1 - sz) * 100) + '%';
      pv.hidden = pos < 0.02; nx.hidden = pos > 0.98;
    };
    el.addEventListener('scroll', upd, { passive: true });
    nx.onclick = () => el.scrollBy({ left: sgn * el.clientWidth * 0.7 });
    pv.onclick = () => el.scrollBy({ left: -sgn * el.clientWidth * 0.7 });
    tr.onclick = e => { const r = tr.getBoundingClientRect(), f = rtl ? (r.right - e.clientX) / r.width : (e.clientX - r.left) / r.width; el.scrollLeft = sgn * f * (el.scrollWidth - el.clientWidth) };
    const on = el.querySelector('.chip.on');
    if (on) { el.style.scrollBehavior = 'auto'; const a = on.getBoundingClientRect(), b = el.getBoundingClientRect(); if (a.left < b.left || a.right > b.right) el.scrollLeft += (a.left + a.width / 2) - (b.left + b.width / 2); el.style.scrollBehavior = '' }
    upd();
  });
}

function stepper(o) {
  const rank = { new: 0, accepted: 2, in_progress: 3, with_courier: 4, delivered: 5, closed: 6 }[o.status] ?? 0;
  const steps = [{ l: 'طلب جديد', d: true }];
  if (o.brokerId) steps.push({ l: 'إسناد من المنسّق', d: true });
  if (o.type === 'text' && !o.direct && !(o.status === 'new' && o.targetCount && !o.brokerId)) steps.push({ l: 'عرض سعر', d: !!o.acceptedQuote });
  steps.push({ l: 'مقبول', d: rank >= 2 }, { l: 'قيد التنفيذ', d: rank >= 3 });
  if (o.needsCourier) steps.push({ l: 'مع المندوب', d: rank >= 4 });

}

let toastT;
function toast(m) { const h = $('#toast-host'); h.innerHTML = `<div class="toast" role="status">${esc(m)}</div>`; clearTimeout(toastT); toastT = setTimeout(() => h.innerHTML = '', 3200) }
function go(v, id) { const prev = state.stack.at(-1); if (v === 'provider' && prev && prev.v === 'category') state.compose.cat = prev.id; state.stack.push({ v, id }); if (v === 'provider') { state.compose.target = id; state.filters.cm = ''; delete state.menus[id] } render(); window.scrollTo(0, 0) }
function openOrder(id) { state.stack = [{ v: 'order', id }]; state.rate = 5; state.rateText = ''; render(); window.scrollTo(0, 0) }
const resetCompose = () => { state.compose = { text: '', cat: '', when: 'أقرب وقت', photo: null, target: null, scope: 'fav' } };

const ACT = {
  retry() { state.boot = 'loading'; render(); boot() },
  changeApi() { state.boot = 'setup'; render() },
  refresh() { run('sync', {}, () => me().status === 'active' ? 'تم اعتماد حسابك' : 'حسابك ما زال بانتظار الاعتماد') },
  authMode(d) { state.auth = d.k; render(); window.scrollTo(0, 0) },
  regRole(d) { state.reg.role = d.k; render() },
  logout() { const t = token; state.sheet = null; logoutLocal(); render(); fetch(apiUrl, { method: 'POST', body: JSON.stringify({ action: 'logout', token: t }) }).catch(() => { }) },
  tab(d) { state.tab = d.k; state.stack = []; state.sheet = null; render(); window.scrollTo(0, 0) },
  sub(d) { state.sub[d.key] = d.k; render() },
  open(d) { if (d.v === 'order') { state.rate = 5; state.rateText = '' } go(d.v, d.v === 'order' ? +d.id : d.id) },
  back() { const t = state.stack.pop(); if (t && t.v === 'provider') state.compose.target = null; render() },
  sheet(d) {
    if (d.type === 'final') { state.sheet = { type: 'final', id: +d.id, k: d.k || '' }; render(); return }
    if (d.type === 'addr') { const a = d.id ? myAddrs().find(x => x.id === d.id) : null; state.addrForm = a ? { label: a.label, district: a.district, details: a.details || '', nat: a.nat || '', lat: a.lat, lng: a.lng } : { label: myAddrs().length ? 'العمل' : 'البيت', district: defAddr()?.district || db.settings.districts[0], details: '', nat: '', lat: null, lng: null }; state.locForm = state.addrForm; state.autoLocate = !hasLoc(state.addrForm) }
    if (d.type === 'shopLoc') { state.locForm = { lat: me().loc?.lat || null, lng: me().loc?.lng || null }; state.autoLocate = !hasLoc(state.locForm) }
    if (d.type === 'catalog') state.filters.cat = ''; state.sheet = { type: d.type, id: d.id ? (['item', 'resetPin', 'addr', 'editUser'].includes(d.type) ? d.id : +d.id) : undefined }; render() },
  close() { state.sheet = null; render() },
  scrim(d, e) { if (e.target.classList.contains('scrim')) { state.sheet = null; render() } },
  pickcat(d) { state.compose.cat = d.keep ? d.id : state.compose.cat === d.id ? '' : d.id; state.compose.scope = 'fav'; render() },
  scope(d) { state.compose.scope = d.k; render() },
  per(d) { state.sub.per = d.k; state.perOff = 0; render() },
  perShift(d) { state.perOff = Math.min(0, state.perOff + +d.k); render() },
  grp(d) { state.grpOpen[d.k] = !state.grpOpen[d.k]; render() },
  payMode(d) { state[d.key].pay = d.k; render() },
  markPaid(d) { run('markPaid', { id: d.id }, 'تم تسجيل السداد') },
  unphoto() { state.compose.photo = null; render() },
  askCat(d) { state.compose.cat = d.id; state.compose.target = null; state.compose.scope = 'fav'; state.stack = []; state.tab = 'home'; render(); window.scrollTo(0, 0); setTimeout(() => $('#c-text')?.focus(), 50) },
  fav(d) { run('toggleFavorite', { pid: d.id }, j => j.added ? 'أُضيف لمفضلتك' : 'أُزيل من مفضلتك') },
  jump(d) { document.getElementById(d.id)?.scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'start' }) },
  qty(d) {
    const top = state.stack.at(-1), pid = top?.id, m = state.menus[pid] || [], it = m.find(x => x.id === d.id); if (!it) return;
    if (!state.cart || state.cart.pid !== pid) { if (state.cart && Object.keys(state.cart.items).length) toast('بدأت سلة جديدة من هذا المحل'); state.cart = { pid, items: {} }; state.co = { fulfil: P(pid)?.delivers ? 'delivery' : 'pickup', note: '', when: 'أقرب وقت' } }
    const step = halfOK(it, itemCat(it, P(pid))) ? 0.5 : 1;
    const cur = state.cart.items[it.id] || 0;
    const q = !cur && +d.d > 0 ? 1 : Math.round((cur + (+d.d) * step) * 2) / 2; if (q <= 0) delete state.cart.items[it.id]; else state.cart.items[it.id] = q; render();
  },
  fulfil(d) { state.co.fulfil = d.k; render() },
  placeOrder() {
    const c = state.cart, lines = Object.entries(c.items).map(([id, qty]) => ({ id, qty }));
    const svc = isSvc(P(c.pid)?.cat);
    run('createMenuOrder', { pid: c.pid, lines, addrId: addrById(state.co.addrId)?.id, fulfil: svc ? 'visit' : state.co.fulfil, note: state.co.note.trim(), when: svc ? whenOf('co') : state.co.when, pay: state.co.pay === 'later' ? 'later' : 'now' }, () => `وصل طلبك إلى ${P(c.pid)?.name || 'المحل'}`,
      j => { state.cart = null; state.compose.target = null; state.stack = [{ v: 'order', id: j.orderId }]; window.scrollTo(0, 0) });
  },
  accept(d) { run('accept', { id: d.id }, 'قبلت الطلب') },
  reject(d) { run('reject', { id: d.id }, 'اعتذرت عن الطلب', () => { if (!O(d.id)) state.stack = [] }) },
  acceptQuote(d) { run('acceptQuote', { id: d.id, quoteId: d.q }, () => `قبلت عرض ${O(d.id)?.providerName || ''}`) },
  start(d) { run('start', { id: d.id }, 'بدأ التنفيذ') },
  requestCourier(d) { run('requestCourier', { id: d.id }, 'طلبنا مندوب، والمهمة ظاهرة للمندوبين') },
  courierTake(d) { run('courierTake', { id: d.id }, 'المهمة لك. توجّه للمحل واستلم الطلب') },
  courierPicked(d) { run('courierPicked', { id: d.id }, 'استلمت الطلب. العميل يعرف إنك في الطريق') },
  complete(d) { run('complete', { id: d.id }, O(d.id)?.pay === 'later' ? 'تم تسجيل التسليم، والمبلغ آجل' : 'تم تسجيل التسليم والتحصيل') },
  openToAll(d) { run('openToAll', { id: d.id }, 'عمّمت الطلب على كل مقدمي الخدمة في الحي') },
  star(d) { state.rate = +d.n; render() },
  rate(d) { run('rate', { id: d.id, stars: state.rate, comment: state.rateText.trim() }, 'شكراً على تقييمك', () => { state.rateText = '' }) },
  pickReason(d) { state.sheet.reason = d.r; render() },
  doCancel() { const id = state.sheet.id, reason = state.sheet.reason; run('cancel', { id, reason }, 'أُلغي الطلب', () => { state.sheet = null }) },
  doAssign(d) { const id = state.sheet.id; run('assign', { id, pid: d.p }, () => `أسندت الطلب إلى ${P(d.p)?.name || ''}`, () => { state.sheet = null }) },
  toggleItem(d) { run('toggleItem', { itemId: d.id }) },
  delItem() { const id = state.sheet.id; run('delItem', { itemId: id }, 'حُذف الصنف', () => { state.sheet = null }) },
  catSec(d) { state.sheet.sec = d.id; render() },
  selVisible() { document.querySelectorAll('.sheet .cchk:not([hidden]) input[name=cid]:not(:disabled)').forEach(c => { if (!state.sheet.sel.includes(c.value)) state.sheet.sel.push(c.value) }); render() },
  addCatalog() { const cat = catalogFor(me()), items = cat.items.filter(i => state.sheet.sel.includes(i.id)).map(i => ({ cid: i.id, sec: i.sec, name: i.name, price: i.price })); run('addItems', { items }, j => `أُضيف ${j.added} صنف لقائمتك`, () => { state.sheet = null; state.filters.cat = '' }) },
  addAllCatalog() { const cat = catalogFor(me()); run('addItems', { items: cat.items.map(i => ({ cid: i.id, sec: i.sec, name: i.name, price: i.price })) }, j => `أُضيف ${j.added} صنف. عدّل الأسعار من زر التعديل`) },
  toggleSound() { lsSet(LS_SOUND, soundOn() ? 'off' : ''); unlockAudio(); if (soundOn()) chime(true); render() },
  testSound() { unlockAudio(); setTimeout(() => chime(true), 60); try { navigator.vibrate && navigator.vibrate([150, 80, 150]) } catch (e) { } },
  askNotif() { try { Notification.requestPermission().then(p => { toast(p === 'granted' ? 'تفعّلت إشعارات المتصفح' : 'ما تفعّلت الإشعارات. تقدر تسمح بها من إعدادات المتصفح'); render() }) } catch (e) { toast('المتصفح ما يدعم الإشعارات') } },
  locateMe() { locateMe() },
  mapStyle(d) {

  pickAddr(d) { state[d.key].addrId = d.id; render() },
  defAddr(d) { run('setDefaultAddress', { addrId: d.id }, 'صار العنوان الأساسي') },
  delAddr() { const id = state.sheet.id; run('deleteAddress', { addrId: id }, 'حُذف العنوان', () => { state.sheet = null }) },
  saveShopLoc() { const f = state.locForm; if (!hasLoc(f)) { toast('حدد الموقع أول'); return } run('setShopLoc', { lat: f.lat, lng: f.lng }, 'حُفظ موقع المحل', () => { state.sheet = null }) },
  uStatus(d) { run('setUserStatus', { userId: d.id, status: d.k }, { active: 'تم التفعيل', blocked: 'تم إيقاف الحساب', rejected: 'تم رفض الطلب' }[d.k]) },
  uRole(d) { run('setRole', { userId: d.id, role: d.k }, d.k === 'broker' ? 'صار منسّقاً' : 'رجع طالب خدمة') }
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el || el.disabled) return;
  const fn = ACT[el.dataset.act]; if (!fn) return;
  if (el.dataset.act === 'scrim' && el !== e.target) return;
  e.preventDefault(); fn(el.dataset, e);
});
document.addEventListener('input', e => {
  const f = e.target.dataset.filter; if (f) { state.filters[f] = e.target.value; applyFilters(); return }
  const b = e.target.dataset.bind; if (!b) return; const [o, k] = b.split('.'); if (o === 'state') state[k] = e.target.value; else state[o][k] = e.target.value;
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.rerender) { const [o, k] = t.dataset.bind.split('.'); state[o][k] = t.value; render(); return }
  if (t.name === 'cid' && state.sheet?.type === 'catalog') {
    const sel = state.sheet.sel, v = t.value; if (t.checked) { if (!sel.includes(v)) sel.push(v) } else sel.splice(sel.indexOf(v), 1);
    const b = document.querySelector('[data-act=addCatalog]'); if (b) { b.disabled = !sel.length; b.textContent = `أضف المحدد (${sel.length})` } return;
  }
  if (t.id === 'lang-sel') { run('setLang', { lang: t.value }, `${LANG_NAMES[t.value]} ✓`); return }
  if (t.name === 'regCats' || t.name === 'shopCats') {
    const arr = t.name === 'regCats' ? state.reg.cats : (state.shopCats = state.shopCats || [...catsOf(me())]), v = t.value;
    if (t.checked) { if (arr.length && kindOf(arr[0]) !== kindOf(v)) arr.splice(0, arr.length); if (!arr.includes(v)) arr.push(v) } else arr.splice(arr.indexOf(v), 1);
    render(); return;
  }
  if (t.name === 'regDistricts') { const ds = state.reg.districts, v = t.value; if (t.checked) { if (!ds.includes(v)) ds.push(v) } else ds.splice(ds.indexOf(v), 1); return }
  if (t.id === 'c-photo') { const f = t.files && t.files[0]; if (!f) return; shrinkImage(f).then(u => { state.compose.photo = u; render() }).catch(() => toast('تعذّرت قراءة الصورة، جرّب صورة ثانية')) }
});
function shrinkImage(file) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => {
      const img = new Image();
      img.onload = () => {
        let side = 720, q = .7, url = '';
        for (let i = 0; i < 8; i++) {
          const s = Math.min(1, side / Math.max(img.width, img.height)), c = document.createElement('canvas');
          c.width = Math.round(img.width * s); c.height = Math.round(img.height * s); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
          url = c.toDataURL('image/jpeg', q); if (url.length < 45000) return res(url);
          side *= .82; q = Math.max(.4, q - .07);
        }
        rej(new Error('big'));
      };
      img.onerror = rej; img.src = r.result;
    };
    r.onerror = rej; r.readAsDataURL(file);
  });
}

const FORMS = {
  final(f) {
    const fd = new FormData(f), amt = +fd.get('amount'); if (!(amt > 0)) { toast('اكتب المبلغ'); return }
    const id = state.sheet.id, note = (fd.get('note') || '').trim();
    if (state.sheet.k === 'price') run('setPrice', { id, amount: amt, priceNote: note }, `تم تسجيل المبلغ ${money(amt)}`, () => { state.sheet = null });
    else run('complete', { id, finalTotal: amt, priceNote: note }, `تم التسليم بمبلغ ${money(amt)}`, () => { state.sheet = null });
  },
  addr(f) {
    const a = state.addrForm, id = state.sheet.id;
    if (!hasLoc(a) && !a.details.trim() && !a.nat.trim()) { toast('حدد الموقع على الخريطة أو اكتب وصفاً للعنوان'); return }
    run('saveAddress', { addrId: id || '', label: a.label, district: a.district, details: a.details.trim(), nat: a.nat.trim(), lat: a.lat, lng: a.lng }, hasLoc(a) ? 'حُفظ العنوان مع موقعه' : 'حُفظ العنوان بدون موقع على الخريطة', () => { state.sheet = null });
  },
  setup(f) { const url = new FormData(f).get('url').trim(); if (!/^https:\/\/script\.google(usercontent)?\.com\//.test(url)) { toast('الرابط لازم يكون من script.google.com'); return } apiUrl = url; lsSet(LS_API, url); state.boot = 'loading'; render(); boot() },
  login(f) {
    const fd = new FormData(f), ph = digits(fd.get('phone')), pin = digits(fd.get('pin'));
    if (ph.length < 9) { toast('اكتب رقم الجوال'); return } if (pin.length !== 4) { toast('الرمز السري 4 أرقام'); return }
    run('login', { phone: ph, pin }, () => `أهلاً ${me().name}`, () => { state.boot = 'ready'; state.tab = ''; state.stack = [] });
  },
  register(f) {
    const r = state.reg;
    if (!r.name.trim()) { toast('اكتب الاسم'); return }
    if (!/^0?5\d{8}$/.test(digits(r.phone))) { toast('رقم الجوال لازم يبدأ بـ 05 ويتكون من 10 أرقام'); return }
    if (!/^\d{4}$/.test(digits(r.pin))) { toast('الرمز السري 4 أرقام'); return }
    if (digits(r.pin) !== digits(r.pin2)) { toast('الرمزان غير متطابقين'); return }
    if (r.role === 'provider' && !r.cats.length) { toast('اختر خدمة واحدة على الأقل'); return }
    if (r.role === 'provider' && !r.districts.length) { toast('اختر حياً واحداً على الأقل'); return }
    const districts = state.config?.districts || [];
    run('register', { role: r.role, name: r.name.trim(), phone: digits(r.phone), pin: digits(r.pin), district: r.district || districts[0], details: r.details.trim(), cat: r.cats[0], cats: r.cats, hours: r.hours.trim(), vehicle: r.vehicle.trim(), districts: r.districts, lang: r.lang },
      () => me().status === 'active' ? `أهلاً ${me().name}، حسابك جاهز` : 'وصل طلب انضمامك للإدارة', () => { state.boot = 'ready'; state.tab = ''; state.reg = { role: 'customer', name: '', phone: '', pin: '', pin2: '', district: '', details: '', cat: '', cats: [], hours: '', vehicle: '', districts: [], lang: 'ar' } });
  },
  'text-order'(f) {
    const c = state.compose, mode = f.dataset.mode, target = mode === 'target' ? c.target : null;
    const text = ($('#c-text').value || '').trim(); c.text = text;
    const cat = target ? tCat(P(target)) : c.cat;
    if (!text) { toast('اكتب طلبك أول'); $('#c-text').focus(); return }
    if (!cat) { toast('اختر نوع الخدمة'); return }
    const favs = target ? [] : favProviders(cat), useFav = !target && favs.length && c.scope === 'fav';
    const targets = target ? [target] : useFav ? favs.map(p => p.id) : [];
    run('createTextOrder', { cat, text, when: CAT(cat).visit ? whenOf('compose') : c.when, photo: c.photo || '', targets, addrId: addrById(c.addrId)?.id, pay: c.pay === 'later' ? 'later' : 'now' },
      () => target ? `وصل طلبك إلى ${P(target)?.name}` : useFav ? `وصل طلبك لمفضلتك (${targets.length})` : 'وصل طلبك لكل مقدمي الخدمة في الحي',
      j => { resetCompose(); state.stack = [{ v: 'order', id: j.orderId }]; window.scrollTo(0, 0) });
  },
  quote(f) { const fd = new FormData(f), price = +fd.get('price'); if (!(price > 0)) { toast('اكتب السعر'); return } run('quote', { id: +f.dataset.id, price, when: fd.get('when'), note: (fd.get('note') || '').trim() }, 'وصل عرضك للعميل') },
  chat(f) { const t = (new FormData(f).get('text') || '').trim(); if (!t) return; run('message', { id: +f.dataset.id, text: t }, null, () => setTimeout(() => $('#chat-text')?.focus(), 30)) },
  profile(f) { const fd = new FormData(f); run('saveProfile', { name: fd.get('name').trim() }, 'حُفظت بياناتك') },
  pin(f) {
    const fd = new FormData(f), n = digits(fd.get('newPin'));
    if (!/^\d{4}$/.test(n)) { toast('الرمز الجديد 4 أرقام'); return } if (n !== digits(fd.get('newPin2'))) { toast('الرمزان غير متطابقين'); return }
    run('changePin', { oldPin: digits(fd.get('oldPin')), newPin: n }, 'تغيّر الرمز السري', () => { state.sheet = null });
  },
  editUser(f) { const fd = new FormData(f), x = (db.users || []).find(y => y.id === state.sheet.id); run('editUser', { userId: state.sheet.id, name: (fd.get('name') || '').trim(), phone: fd.get('phone') || x?.phone }, 'تم حفظ التعديل', () => { state.sheet = null }) },
  resetPin(f) { const pin = digits(new FormData(f).get('pin')); if (!/^\d{4}$/.test(pin)) { toast('الرمز 4 أرقام'); return } const id = state.sheet.id; run('resetPin', { userId: id, pin }, 'تم تعيين الرمز الجديد', () => { state.sheet = null }) },
  shop(f) {
    const fd = new FormData(f), ds = fd.getAll('districts'); if (!ds.length) { toast('اختر حياً واحداً على الأقل'); return }
    const cats = fd.getAll('shopCats'); if (!cats.length) { toast('اختر خدمة واحدة على الأقل'); return }
    run('saveShop', { cats, name: fd.get('name').trim(), hours: fd.get('hours').trim(), districts: ds, visitFee: fd.get('visitFee'), deliveryFee: fd.get('deliveryFee'), minOrder: fd.get('minOrder'), delivers: fd.get('delivers') === 'on', usesCourier: fd.get('usesCourier') === 'on' }, 'حُفظت بيانات المحل', () => { state.shopCats = null });
  },
  item(f) {
    const fd = new FormData(f), name = fd.get('name').trim(), price = fd.get('price'); if (!name || price === '') { toast('اكتب الاسم والسعر'); return }
    run('saveItem', { itemId: state.sheet.id || '', name, price, sec: fd.get('sec') || '' }, 'حُفظ الصنف', () => { state.sheet = null });
  },
  settings(f) {
    const fd = new FormData(f), ds = fd.get('districts').split(/\n|،|,/).map(x => x.trim()).filter(Boolean);
    run('saveSettings', { trial: fd.get('trial') === 'on', trialEnds: fd.get('trialEnds'), platformRate: fd.get('platformRate'), brokerPlatformRate: fd.get('brokerPlatformRate'), brokerRate: fd.get('brokerRate'), districts: ds }, 'حُفظت الإعدادات');
  }
};
document.addEventListener('submit', e => { const f = e.target.closest('form[data-form]'); if (!f) return; e.preventDefault(); FORMS[f.dataset.form]?.(f) });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && state.sheet) { state.sheet = null; render() } });

/* ---------- التشغيل ---------- */
async function boot() {
  if (!apiUrl) { state.boot = 'setup'; return render() }
  if (token) {
    try { await call('sync'); state.boot = 'ready'; setAlertBaseline(); return render() }
    catch (e) { if (token) { state.boot = 'error'; state.bootError = e.message; return render() } }
  }
  try { state.config = (await call('config')).config; state.boot = 'auth' }
  catch (e) { state.boot = 'error'; state.bootError = e.message }
  render();
}
render(); boot();

</script>
